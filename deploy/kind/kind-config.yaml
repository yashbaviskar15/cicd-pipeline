# kind cluster for local Kubernetes development / demos.
#   kind create cluster --config deploy/kind/kind-config.yaml
# Requires an ingress controller (see the Makefile `k8s-up` target).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cicd-pipeline
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
