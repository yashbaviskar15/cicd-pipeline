# Production overrides: HA, autoscaling, ingress + TLS, PDB, ServiceMonitor.
replicaCount: 3

image:
  pullPolicy: IfNotPresent

config:
  NODE_ENV: production
  LOG_LEVEL: info
  TRUST_PROXY: "true"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-tls
      hosts:
        - api.example.com

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api

serviceMonitor:
  enabled: true
  interval: 15s

# In production, prefer an externally managed Secret (e.g. External Secrets
# Operator / Sealed Secrets) instead of committing values here.
existingSecret: backend-secrets
