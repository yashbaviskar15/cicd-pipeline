# Dev overrides: cheap, single replica, no autoscaling/ingress.
replicaCount: 1

image:
  tag: dev

config:
  NODE_ENV: development
  LOG_LEVEL: debug
  CORS_ORIGIN: "*"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: false

serviceMonitor:
  enabled: false

# For local kind/minikube use --set secrets.* from your .env (never commit).
secrets:
  DATABASE_URL: ""
  JWT_SECRET: ""
  JWT_REFRESH_SECRET: ""
