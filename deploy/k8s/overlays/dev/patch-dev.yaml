# Dev tweaks: single replicas, debug logging, in-cluster Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  minReplicas: 1
  maxReplicas: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  NODE_ENV: development
  LOG_LEVEL: debug
  OTEL_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
stringData:
  DATABASE_URL: "postgresql://app:app@postgres:5432/app?schema=public"
  JWT_SECRET: "dev-only-jwt-secret-change-me-0123456789"
  JWT_REFRESH_SECRET: "dev-only-jwt-refresh-secret-change-me-0123456789"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
