# Placeholder Secret. In real clusters use External Secrets / Sealed Secrets
# and never commit real credentials. Overlays patch the values (e.g. from a
# local .env for kind) or reference an externally managed Secret.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: backend
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app:app@postgres:5432/app?schema=public"
  JWT_SECRET: "replace-me-with-a-32char-minimum-secret-value"
  JWT_REFRESH_SECRET: "replace-me-with-a-32char-minimum-refresh-secret"
