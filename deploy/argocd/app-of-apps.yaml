apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-pipeline
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cicd-pipeline
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yashbaviskar15/cicd-pipeline.git
    targetRevision: main
    path: deploy/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
