name: Reusable · Terraform Plan

# Reusable Terraform validation + plan. Always runs `fmt -check` and `validate`;
# when AWS OIDC is configured (vars.AWS_GITHUB_ACTIONS_ROLE_ARN + vars.TF_STATE_BUCKET)
# it also plans against the remote state and comments the plan on the PR.
#
# Optional Infracost cost estimate when secrets.INFRACOST_API_KEY is present.

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to plan (dev, staging, prod)
        required: true
        type: string
      terraform-version:
        description: Terraform CLI version
        required: false
        type: string
        default: "1.9.8"

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest

    # Secrets cannot be used directly in `if:` expressions, so expose the token
    # as an environment variable and gate on it instead.
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: terraform
        # `legacy/` is a frozen copy of the original flat config, so it is excluded.
        run: terraform fmt -check -recursive environments modules bootstrap

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Configure AWS credentials (OIDC)
        id: aws
        if: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-terraform-${{ inputs.environment }}

      - name: terraform init (remote state)
        if: ${{ steps.aws.outcome == 'success' }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cicd-pipeline/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -backend-config="encrypt=true"

      - name: terraform plan
        id: plan
        if: ${{ steps.aws.outcome == 'success' }}
        run: |
          terraform plan -no-color -lock-timeout=5m \
            -var-file=terraform.tfvars.example \
            -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Upload plan artifact
        if: ${{ steps.aws.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: terraform/environments/${{ inputs.environment }}/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: ${{ github.event_name == 'pull_request' && steps.aws.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/environments/${{ inputs.environment }}/plan.txt';
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'no plan output';
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n... (truncated)';
            }
            const marker = '<!-- tf-plan-${{ inputs.environment }} -->';
            const failed = '${{ steps.plan.outcome }}' === 'failure';
            const body = [
              marker,
              `### Terraform Plan · \`${{ inputs.environment }}\` ${failed ? '❌' : '✅'}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail if plan failed
        if: ${{ steps.plan.outcome == 'failure' }}
        run: exit 1

      - name: Infracost setup
        if: ${{ steps.aws.outcome == 'success' && env.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Infracost breakdown & comment
        if: ${{ steps.aws.outcome == 'success' && env.INFRACOST_API_KEY != '' }}
        continue-on-error: true
        run: |
          infracost breakdown \
            --path . \
            --terraform-plan-flags="-var-file=terraform.tfvars.example" \
            --format json --out-file /tmp/infracost.json
          infracost comment github \
            --path /tmp/infracost.json \
            --repo "$GITHUB_REPOSITORY" \
            --github-token "${{ github.token }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --behavior update
