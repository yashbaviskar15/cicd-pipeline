name: PR · CI

# Pull-request validation: lint, tests + coverage, image build/scan/SBOM,
# security scans and Terraform plan. Runs on every PR targeting main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    name: Node CI (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        service: [backend]
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      working-directory: ${{ matrix.service }}

  docker:
    name: Docker (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      service: ${{ matrix.service }}

  security:
    name: Security scans
    uses: ./.github/workflows/reusable-security.yml

  terraform:
    name: Terraform (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    uses: ./.github/workflows/reusable-terraform-plan.yml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit
