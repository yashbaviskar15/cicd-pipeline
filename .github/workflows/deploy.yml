name: Main · Build, Sign & Deploy

# Runs on every push to main. Builds and scans both images, pushes them to
# Amazon ECR using GitHub OIDC (no long-lived AWS keys), signs them with
# Cosign (keyless / Sigstore) and optionally triggers a blue/green deploy.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  node-ci:
    name: Node CI (backend)
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      working-directory: backend

  docker-scan:
    name: Docker build & scan (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      service: ${{ matrix.service }}

  publish:
    name: Push & sign (${{ matrix.service }})
    needs: [node-ci, docker-scan]
    if: ${{ vars.ENABLE_AWS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ matrix.service }}-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

  deploy:
    name: Deploy (blue/green)
    needs: publish
    if: ${{ vars.ENABLE_AWS_DEPLOY == 'true' && vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment_id: ${{ steps.trigger.outputs.deployment_id }}
      previous_task_definition: ${{ steps.previous.outputs.task_definition }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Remember the currently-serving (known-good) task definition so we can
      # roll back to it if the post-deploy smoke test fails.
      - name: Capture current known-good task definition
        id: previous
        run: |
          PREV=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_NAME }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "Known-good task definition: $PREV"
          echo "task_definition=$PREV" >> "$GITHUB_OUTPUT"

      - name: Trigger CodeDeploy blue/green deployment
        id: trigger
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "${{ vars.CODEDEPLOY_APP_NAME }}" \
            --deployment-group-name "${{ vars.CODEDEPLOY_GROUP_NAME }}" \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --revision "revisionType=AppSpecContent,appSpecContent={content='{\"version\":0.0,\"Resources\":[{\"TargetService\":{\"Type\":\"AWS::ECS::Service\",\"Properties\":{\"TaskDefinition\":\"${{ vars.ECS_TASK_DEFINITION_ARN }}\",\"LoadBalancerInfo\":{\"ContainerName\":\"backend\",\"ContainerPort\":3000}}}}]}'}" \
            --description "GitHub Actions ${GITHUB_SHA}" \
            --query 'deploymentId' --output text)
          echo "Started CodeDeploy deployment $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the blue/green deployment to finish
        run: |
          aws deploy wait deployment-successful --deployment-id "${{ steps.trigger.outputs.deployment_id }}"

  smoke:
    name: Post-deploy smoke test
    needs: deploy
    if: ${{ vars.ENABLE_AWS_DEPLOY == 'true' && vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # continue-on-error lets us run the rollback step before failing the job.
      - name: Run post-deploy smoke tests
        id: smoke
        continue-on-error: true
        run: node scripts/smoke-test.mjs
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          SMOKE_RETRIES: "3"

      # Automatic rollback: redeploy the previous known-good task definition as
      # a new blue/green deployment. CodeDeploy swaps traffic back to the old
      # (blue) revision, restoring the service without a manual intervention.
      - name: Automatic rollback to previous task definition
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Smoke tests failed — rolling back to ${{ needs.deploy.outputs.previous_task_definition }}"
          aws deploy create-deployment \
            --application-name "${{ vars.CODEDEPLOY_APP_NAME }}" \
            --deployment-group-name "${{ vars.CODEDEPLOY_GROUP_NAME }}" \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --revision "revisionType=AppSpecContent,appSpecContent={content='{\"version\":0.0,\"Resources\":[{\"TargetService\":{\"Type\":\"AWS::ECS::Service\",\"Properties\":{\"TaskDefinition\":\"${{ needs.deploy.outputs.previous_task_definition }}\",\"LoadBalancerInfo\":{\"ContainerName\":\"backend\",\"ContainerPort\":3000}}}}]}'}" \
            --description "Automatic rollback of ${GITHUB_SHA}" \
            --output json
          echo "::error::Deployment rolled back automatically. Investigate the failing smoke test."

      - name: Fail the workflow if rollback was triggered
        if: steps.smoke.outcome == 'failure'
        run: exit 1
