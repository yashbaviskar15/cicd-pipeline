global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    environment: dev

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend API - RED metrics + custom business metrics (prom-client).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
        labels:
          service: cicd-backend

  # OpenTelemetry Collector self-metrics.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
